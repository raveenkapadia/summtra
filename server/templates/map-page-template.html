<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --deep-purple: #2D1B4E;
            --royal-purple: #4A1C6B;
            --gold: #D4AF37;
            --gold-light: #E8D5A3;
            --cream: #FDF8F0;
            --soft-white: #FEFEFE;
            --text-dark: #1A1A2E;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--cream);
        }
        
        .map-page {
            width: 297mm;
            height: 210mm;
            position: relative;
            overflow: hidden;
            background: var(--cream);
            page-break-after: always;
        }
        
        .page-header {
            background: linear-gradient(135deg, var(--deep-purple) 0%, var(--royal-purple) 100%);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-logo {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--gold);
            text-transform: uppercase;
        }
        
        .header-divider {
            width: 1px;
            height: 18px;
            background: var(--gold);
            opacity: 0.4;
        }
        
        .header-section {
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--cream);
            text-transform: uppercase;
        }
        
        .page-number {
            font-size: 10px;
            color: var(--gold-light);
        }
        
        .map-container {
            padding: 15px 30px;
        }
        
        .map-title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .map-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--deep-purple);
        }
        
        .map-subtitle {
            font-size: 11px;
            color: #666;
        }
        
        .goal-badge {
            padding: 5px 15px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            color: var(--deep-purple);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 15px;
        }
        
        .map-frame {
            border: 2px solid var(--deep-purple);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(45, 27, 78, 0.15);
        }
        
        .map-image {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .map-caption {
            background: var(--deep-purple);
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .caption-text {
            font-size: 9px;
            color: var(--cream);
        }
        
        .caption-note {
            font-size: 9px;
            color: var(--gold);
        }
        
        .page-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 30px;
            background: var(--soft-white);
            border-top: 1px solid rgba(45, 27, 78, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .footer-left, .footer-right {
            font-size: 8px;
            color: #999;
        }
        
        .footer-center {
            font-size: 8px;
            color: var(--royal-purple);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .legend-page {
            width: 210mm;
            height: 297mm;
            position: relative;
            overflow: hidden;
            background: var(--cream);
            page-break-after: always;
        }

        .legend-image {
            width: 100%;
            height: auto;
        }

        .city-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 15px 30px;
        }

        .city-card {
            border: 1px solid rgba(45, 27, 78, 0.2);
            border-radius: 6px;
            overflow: hidden;
            background: white;
        }

        .city-card-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .city-card-info {
            padding: 8px 10px;
        }

        .city-card-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--deep-purple);
        }

        .city-card-score {
            font-size: 10px;
            color: var(--gold);
        }
    </style>
</head>
<body>
    <!-- Template variables will be replaced by the PDF generator -->

    <!-- {{LEGEND_PAGE}} - Insert legend page HTML here -->
</body>
</html>
