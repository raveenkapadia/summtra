<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ssumitra Report - Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --deep-navy: #0a0a1a; --cosmic-blue: #12122a; --midnight: #1a1a35; --card-bg: #1e1e3f;
      --gold: #c9a962; --bright-gold: #e8d5a3; --soft-gold: rgba(201, 169, 98, 0.15);
      --text-primary: #f5f5f5; --text-secondary: #b8b8c8; --text-muted: #8888a0;
      --font-display: 'Cormorant Garamond', serif; --font-body: 'Montserrat', sans-serif;
      --space-xs: 8px; --space-sm: 16px; --space-md: 24px; --space-lg: 40px; --space-xl: 60px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); font-size: 14px; line-height: 1.6; color: var(--text-primary); background: var(--deep-navy); }
    .page { width: 800px; min-height: 1130px; margin: 0 auto; background: linear-gradient(180deg, var(--deep-navy) 0%, var(--cosmic-blue) 100%); position: relative; overflow: hidden; }
    .page-content { padding: var(--space-xl); position: relative; z-index: 2; }
    .section-label { font-family: var(--font-body); font-weight: 500; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); }
    .section-title { font-family: var(--font-display); font-weight: 500; font-size: 28px; color: var(--text-primary); margin-bottom: var(--space-md); }
    .body-text { font-size: 14px; color: var(--text-secondary); line-height: 1.8; }
    .map-container { background: var(--card-bg); border: 1px solid rgba(201, 169, 98, 0.15); border-radius: 16px; padding: var(--space-md); margin: var(--space-lg) 0; }
    .map-placeholder { height: 650px; background: linear-gradient(135deg, var(--midnight), var(--cosmic-blue)); border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .map-placeholder img, .map-placeholder svg { width: 100%; height: 100%; object-fit: contain; }
    .map-caption { text-align: center; margin-top: var(--space-sm); font-size: 12px; color: var(--text-muted); }
    .key-lines { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-sm); margin-top: var(--space-md); padding-top: var(--space-md); border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .key-line { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
    .key-line-symbol { color: var(--gold); }
    .page-footer { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: var(--space-md) var(--space-xl); border-top: 1px solid rgba(201, 169, 98, 0.1); font-size: 11px; color: var(--text-muted); }
    .footer-quote { font-family: var(--font-display); font-style: italic; }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-content">
      <div class="section-label">{{MAP_LABEL}}</div>
      <h1 class="section-title">{{MAP_TITLE}}</h1>
      <p class="body-text">{{MAP_DESCRIPTION}}</p>
      
      <div class="map-container">
        <div class="map-placeholder">{{MAP_SVG}}</div>
        <div class="map-caption">{{MAP_CAPTION}}</div>
        <div class="key-lines">{{MAP_KEY_LINES}}</div>
      </div>
    </div>
    
    <div class="page-footer">
      <span>© Ssumitra {{YEAR}}</span>
      <span class="footer-quote">"The world is your celestial canvas."</span>
      <span>{{MAP_PAGE_LABEL}}</span>
    </div>
  </div>
</body>
</html>
