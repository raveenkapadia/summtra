<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ssumitra Report - Goal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --deep-navy: #0a0a1a; --cosmic-blue: #12122a; --midnight: #1a1a35; --card-bg: #1e1e3f;
      --gold: #c9a962; --bright-gold: #e8d5a3; --soft-gold: rgba(201, 169, 98, 0.15);
      --text-primary: #f5f5f5; --text-secondary: #b8b8c8; --text-muted: #8888a0;
      --font-display: 'Cormorant Garamond', serif; --font-body: 'Montserrat', sans-serif;
      --space-xs: 8px; --space-sm: 16px; --space-md: 24px; --space-lg: 40px; --space-xl: 60px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-body); font-size: 14px; line-height: 1.6; color: var(--text-primary); background: var(--deep-navy); }
    .page { width: 800px; min-height: 1130px; margin: 0 auto; background: linear-gradient(180deg, var(--deep-navy) 0%, var(--cosmic-blue) 100%); position: relative; overflow: hidden; }
    .page-content { padding: var(--space-xl); position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; min-height: 1000px; }
    .body-text { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }
    .goal-header { text-align: center; padding: var(--space-xl) var(--space-lg); background: linear-gradient(135deg, var(--soft-gold), rgba(107, 91, 149, 0.15)); border: 1px solid rgba(201, 169, 98, 0.25); border-radius: 24px; }
    .goal-icon { font-size: 64px; margin-bottom: var(--space-md); }
    .goal-title { font-family: var(--font-display); font-weight: 300; font-size: 48px; color: var(--text-primary); margin-bottom: var(--space-xs); letter-spacing: 2px; }
    .goal-subtitle { font-size: 14px; color: var(--text-muted); letter-spacing: 1px; }
    .goal-stats { display: flex; justify-content: center; gap: var(--space-xl); margin-top: var(--space-lg); }
    .goal-stat { text-align: center; }
    .goal-stat-value { font-family: var(--font-display); font-size: 42px; font-weight: 300; color: var(--bright-gold); }
    .goal-stat-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }
    .goal-planets { display: flex; justify-content: center; gap: var(--space-sm); margin-top: var(--space-lg); }
    .goal-planet { display: flex; align-items: center; gap: var(--space-xs); padding: 8px 16px; background: var(--card-bg); border: 1px solid rgba(201, 169, 98, 0.15); border-radius: 20px; font-size: 13px; color: var(--text-secondary); }
    .goal-planet-symbol { color: var(--gold); font-size: 16px; }
    .text-center { text-align: center; }
    .mt-lg { margin-top: var(--space-lg); }
    .page-footer { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: var(--space-md) var(--space-xl); border-top: 1px solid rgba(201, 169, 98, 0.1); font-size: 11px; color: var(--text-muted); }
    .footer-quote { font-family: var(--font-display); font-style: italic; }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-content">
      <div class="goal-header">
        <div class="goal-icon">{{GOAL_ICON}}</div>
        <h1 class="goal-title">{{GOAL}}</h1>
        <div class="goal-subtitle">{{GOAL_DESCRIPTION}}</div>
        
        <div class="goal-stats">
          <div class="goal-stat"><div class="goal-stat-value">{{BEST_CITIES_COUNT}}</div><div class="goal-stat-label">Best Cities</div></div>
          <div class="goal-stat"><div class="goal-stat-value">{{AVOID_CITIES_COUNT}}</div><div class="goal-stat-label">Cities to Avoid</div></div>
          <div class="goal-stat"><div class="goal-stat-value">{{POWER_ZONES_COUNT}}</div><div class="goal-stat-label">Power Zones</div></div>
        </div>
        
        <div class="goal-planets">{{GOAL_PLANETS}}</div>
      </div>
      
      <p class="body-text text-center mt-lg">{{GOAL_EXPLANATION}}</p>
    </div>
    
    <div class="page-footer">
      <span>© Ssumitra {{YEAR}}</span>
      <span class="footer-quote">"Abundance flows where energy goes."</span>
      <span>{{GOAL}} Analysis</span>
    </div>
  </div>
</body>
</html>
